[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingva-sdk"
version = "0.1.5"
description = "Python client for the Lingva localization platform"
readme = "README.md"
license = { text = "SEE LICENSE IN LICENSE.md" }
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
http = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/lingva"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
