name: Update Lingva formula
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
concurrency:
  group: update-lingva
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/update-homebrew-tap.mjs
      - name: Commit only a changed formula
        shell: bash
        run: |
          if git diff --quiet -- Formula/lingva.rb; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/lingva.rb
          git commit -m 'chore: update Lingva formula'
          git push
