packages:
  - apps/*
  - packages/*
  # Consumer-plane reference apps: customer-developer experience (SDK/CLI as code).
  # They consume @lingva/* via workspace:* and run as first-class workspace members.
  - examples/*

# The workspace currently relies on flat access to several build-time tools.
# pnpm 12 reads this setting here rather than from .npmrc.
shamefullyHoist: true

# pnpm 12 blocks dependency lifecycle scripts by default. Native build tools
# required by the workspace are allowed explicitly; optional telemetry,
# polyfill, and native-acceleration installers stay disabled.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  core-js: false
  lmdb: false
  msgpackr-extract: false
  msw: false

# pnpm 12 reads dependency-resolution policy from the workspace manifest.
# Keep security pins centralized so every workspace and CI job resolves the
# same patched transitive versions.
overrides:
  '@hono/node-server': 1.19.13
  '@babel/plugin-transform-modules-systemjs': 7.29.4
  fast-uri: 3.1.8
  fast-xml-parser: 5.7.0
  follow-redirects: 1.16.0
  lodash-es: 4.18.0
  mermaid: 11.16.1
  js-cookie: 3.0.7
  postcss: 8.5.28
  qs: 6.16.0
  serialize-javascript: 7.0.5
  sharp: 0.35.5
  source-map-js: 1.2.2
  shell-quote: 1.12.0
  simple-git: 4.0.2
  uuid: 14.0.0
  vite: 8.1.5
  webpack-dev-server: 5.2.6
  'ip-address@<=10.1.0': '>=10.1.1'
  'joi@<17.13.4': '>=17.13.4'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  'vite@>=8.0.0 <=8.0.15': '>=8.0.16'
  'launch-editor@<=2.14.0': '>=2.14.1'
  '@babel/core@<=7.29.0': 7.29.6
  'hono@<4.12.25': '>=4.12.25'
  'webpack-dev-server@<=5.2.5': 5.2.6
  'dompurify@<3.4.16': '>=3.4.16'
  'devalue@<5.9.3': 5.9.3
  'http-proxy-middleware@>=0.16.0 <2.0.10': '>=2.0.10'
  'js-yaml@<3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'
  'ws@>=7.0.0 <7.5.11': '>=7.5.11'
  'webpack-bundle-analyzer>ws': 8.21.0
  'svgo@>=3.0.0 <3.3.5': 3.3.5
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=3.0.0 <5.0.12': 5.0.12
  '@humanfs/node@<0.16.8': 0.16.8
  'cookie@<0.7.0': 0.7.2

# node-forge 1.4.0 has no fixed npm release for CVE-2026-85393 yet. Apply the
# exact upstream fix from digitalbazaar/forge#1152. The narrowly scoped audit
# exception below exists because the registry only sees the upstream version,
# not this patched artifact. Remove both when node-forge 1.4.1 or newer is
# available through listhen.
patchedDependencies:
  node-forge@1.4.0: patches/node-forge@1.4.0.patch

auditConfig:
  ignoreGhsas:
    # braces 3.0.3 has no patched release for GHSA-vfj7-8cjw-p6xm. It is
    # reached only through Nuxt/Nitro build-time globbing in the reference
    # example, where patterns come from this repository rather than users.
    # Remove this exception as soon as braces publishes a fixed version.
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-86w9-cpqp-85rv
