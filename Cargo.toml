[workspace]
members = ["crates/lingva-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "LicenseRef-Lingva-Proprietary"
repository = "https://github.com/usausoft/lingva"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
open = "5.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tiny_http = "0.12"
url = "2.5"
