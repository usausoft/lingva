name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - 'python-sdk/v*'

permissions:
  contents: read
  id-token: write # required for trusted publishing

jobs:
  publish:
    name: Build and publish lingva-sdk
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install hatch
        run: pip install hatch

      - name: Verify immutable SDK identity
        run: python -c 'import os,tomllib,pathlib; v=tomllib.loads(pathlib.Path("sdks/python/pyproject.toml").read_text())["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "python-sdk/v" + v'

      - name: Run tests
        working-directory: sdks/python
        run: |
          pip install -e ".[dev]"
          python -m pytest -v

      - name: Build distribution
        working-directory: sdks/python
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
