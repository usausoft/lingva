name: Applications
on:
  workflow_dispatch:
    inputs:
      app:
        description: Application to build
        required: true
        type: choice
        options:
          - docs
      stage:
        description: Deployment stage
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
concurrency:
  group: applications-${{ inputs.app }}-${{ inputs.stage }}
  cancel-in-progress: false
env:
  CI: true
  NODE_VERSION: 24
  PNPM_VERSION: 12.8.1
  APP_TARGET: ${{ inputs.app }}
jobs:
  build:
    name: build ${{ inputs.app }} ${{ inputs.stage }}
    if: ${{ (inputs.stage == 'dev' && github.ref_type == 'branch' && github.ref_name
      == 'dev') || (inputs.stage == 'stage' && github.ref_type == 'branch' &&
      github.ref_name == 'main') || (inputs.stage == 'prod' && github.ref_type
      == 'tag') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage == 'dev' && 'Development' || inputs.stage ==
      'stage' && 'Staging' || 'Production' }}
    permissions:
      contents: read
    env:
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
      PUBLIC_DOCS_URL: ${{ vars.PUBLIC_DOCS_URL }}
      ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
      ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build selected application
        shell: bash
        run: pnpm --filter @lingva/docs build
      - name: Upload docs artifact
        if: ${{ inputs.app == 'docs' }}
        uses: actions/upload-artifact@v6
        with:
          name: docs-${{ inputs.stage }}
          path: apps/docs/build
