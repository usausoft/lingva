name: Native SDKs and Python

on:
  workflow_call:
    inputs:
      sdk:
        type: string
        required: true

permissions:
  contents: read

jobs:
  swift:
    name: Swift preview
    if: inputs.sdk == 'swift'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test Swift package
        run: swift test --package-path sdks/swift

  kotlin:
    name: Kotlin preview
    if: inputs.sdk == 'kotlin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.3
      - name: Test Kotlin package
        run: gradle -p sdks/kotlin test publishToMavenLocal

  python:
    name: Python SDK
    if: inputs.sdk == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dev dependencies
        working-directory: sdks/python
        run: pip install -e ".[dev]"
      - name: Test Python SDK
        working-directory: sdks/python
        run: python -m pytest -v

  flutter:
    name: Flutter preview
    if: inputs.sdk == 'flutter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Install Flutter dependencies
        working-directory: sdks/flutter
        run: flutter pub get
      - name: Analyze Flutter package
        working-directory: sdks/flutter
        run: flutter analyze
      - name: Test Flutter package
        working-directory: sdks/flutter
        run: flutter test
