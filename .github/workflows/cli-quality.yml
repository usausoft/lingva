name: Linux CLI quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    env:
      LINGVA_CLI_BINARY: ${{ github.workspace }}/target/debug/lingva
      LINGVA_CLI_NATIVE_REQUIRED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify adapter version pins
        run: node scripts/verify-cli-engine-version.mjs
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - name: Install pinned Rust coverage runner
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Record Rust coverage and reject regressions below the measured floor
        run: cargo llvm-cov --workspace --locked --lcov --output-path target/cli-coverage.lcov --fail-under-lines 90
      - uses: actions/upload-artifact@v4
        with:
          name: rust-cli-coverage
          path: target/cli-coverage.lcov
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Reject broken Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Verify the crates.io package from its archive
        run: cargo package --locked --package lingva
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cli-release
      - run: pnpm --filter @lingva/core run build
      - run: pnpm --filter @lingva/cli run build
      - run: pnpm --filter @lingva/cli run test
      - run: pnpm --filter @lingva/cli run lint
      - run: pnpm --filter @lingva/cli run typecheck
      - name: Verify npm adapter uses the native engine
        run: node packages/cli/dist/native-launcher.mjs --version
      - name: Verify PyPI adapter uses the native engine
        env:
          PYTHONPATH: sdks/python-cli/src
        run: python3 -c 'from lingva_cli._launcher import main; main()' --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e 'sdks/python-cli[dev]'
      - run: python -m pytest sdks/python-cli/tests --cov=lingva_cli --cov-branch --cov-fail-under=100 --cov-report=term-missing
