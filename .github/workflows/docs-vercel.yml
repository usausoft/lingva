name: Public Docs Vercel

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Public docs deployment stage
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

concurrency:
  group: docs-vercel-${{ inputs.stage }}
  cancel-in-progress: false

env:
  CI: true
  NODE_VERSION: 24
  PNPM_VERSION: 12.8.1

jobs:
  deploy:
    name: deploy public docs ${{ inputs.stage }} to Vercel
    # Development follows dev, Staging follows main, and Production requires a
    # tag ref.
    if: ${{ (inputs.stage == 'dev' && github.ref_type == 'branch' && github.ref_name == 'dev') || (inputs.stage == 'stage' && github.ref_type == 'branch' && github.ref_name == 'main') || (inputs.stage == 'prod' && github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage == 'dev' && 'Development' || inputs.stage == 'stage' && 'Staging' || 'Production' }}
    permissions:
      contents: read
    env:
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
      DOCS_RUNTIME_LOCALE: ${{ vars.DOCS_RUNTIME_LOCALE }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
      ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      VERCEL_ORG_ID: ${{ vars.DOCS_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.DOCS_VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TARGET: ${{ inputs.stage == 'prod' && 'production' || 'preview' }}
      VERCEL_CANONICAL_URL: ${{ vars.DOCS_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate docs Vercel configuration
        shell: bash
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN
          do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Missing required docs deploy variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Build public docs workspace dependencies
        # A workspace install links internal packages but does not create their
        # dist outputs, which Docusaurus typechecking imports.
        run: pnpm turbo run build --filter='@lingva/docs^...'

      - name: Run public docs checks
        run: |
          pnpm --filter @lingva/docs typecheck
          pnpm --filter @lingva/docs test

      - name: Pull Vercel project settings
        run: pnpm dlx vercel pull --yes --environment="${VERCEL_TARGET}" --token "${VERCEL_TOKEN}"

      - name: Build public docs for Vercel
        shell: bash
        run: |
          args=(build --token "${VERCEL_TOKEN}")
          if [ "${VERCEL_TARGET}" = "production" ]; then
            args+=(--prod)
          fi
          pnpm dlx vercel "${args[@]}"

      - name: Deploy public docs to Vercel
        id: deploy
        shell: bash
        run: |
          args=(deploy --prebuilt --token "${VERCEL_TOKEN}")
          if [ "${VERCEL_TARGET}" = "production" ]; then
            args+=(--prod)
          fi
          deployment_url="$(pnpm dlx vercel "${args[@]}")"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Point canonical domain to deployment
        if: ${{ env.VERCEL_CANONICAL_URL != '' }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          canonical_domain="${VERCEL_CANONICAL_URL#https://}"
          canonical_domain="${canonical_domain#http://}"
          canonical_domain="${canonical_domain%/}"
          pnpm dlx vercel alias set "${DEPLOYMENT_URL}" "${canonical_domain}" --token "${VERCEL_TOKEN}"
